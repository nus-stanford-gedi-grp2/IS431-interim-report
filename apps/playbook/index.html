Kiosks`,subtitle:"",layout:"freeform",canvas:{aspectRatio:1.7777777777777777,referenceWidth:1280},heading:{frame:{x:44,y:22,width:50,height:34,rotation:0,zIndex:1},style:{fontSize:64,lineHeight:1.05},eyebrowFontSize:22,subtitleFontSize:22},theme:"ink",sourceRefs:[{path:"docs/ground_truth.md",sectionId:"pdf-page-06-chapter-1-divider-1",sectionHash:"ddb400e38beaa0ad89c5e1d6c2748eb3a8f86b40f05d74ffe66ea21514ec562d"}],notes:"",blocks:[{id:"chapter-1-kiosk",slot:"full",locked:!1,frame:{x:7,y:12,width:30,height:78,rotation:0,zIndex:2},type:"image",props:{src:"chapter-kiosk-1.svg",alt:"Kiosk showing chapter 1",caption:""}},{id:"chapter-1-rule",slot:"full",locked:!1,frame:{x:44,y:57,width:22,height:2,rotation:0,zIndex:2},style:{background:"#B88A68",borderRadius:2},type:"shape",props:{kind:"rectangle",label:"Orange divider rule"}},{id:"chapter-1-subtitle",slot:"full",locked:!1,frame:{x:44,y:62,width:50,height:12,rotation:0,zIndex:2},style:{fontSize:26,color:"#FFFFFF",lineHeight:1.35},type:"text",content:{type:"doc",content:[{type:"paragraph",content:[{type:"text",text:"Benefits + Case Studies",marks:[{type:"italic"}]}]}]}}]},{schemaVersion:1,id:"value-adds",eyebrow:"Chapter 1 · Understanding Kiosks",title:"The various value-adds of kiosks",subtitle:"Select each benefit to see how it works, what it needs and how you would measure it.",layout:"single",theme:"sage",sourceRefs:[{path:"docs/ground_truth.md",sectionId:"pdf-page-07-the-various-value-adds-of-kiosks-1",sectionHash:"090c0592ff94c7aae6918fd264b76c0d90aa0b3a0fbe59608b6b79aff9e0fa5f"}],notes:"",blocks:[{id:"benefit-map",slot:"full",locked:!1,type:"explorer",props:{title:"Four ways a kiosk can add value",dataLabel:"Four benefit themes from the source. Mechanisms, trade-offs and metrics are suggested teaching aids — none of these benefits is guaranteed.",variant:"hub",centerLabel:"Kiosk",items:[{id:"manpower",label:"Manpower",icon:"staff",kicker:"Benefit 1",heading:"Reduced manpower costs, or reallocation of tasks to improve manpower efficiency",body:"Guests complete routine steps themselves, so staff spend less time on data entry and room allocation.",bullets:["Needs: enough eligible guests choosing the kiosk, and staff roles redesigned around it.","Trade-off: released time is only a cash saving if rosters or overtime actually fall.","Metric to validate: payroll hours genuinely removed or reallocated."],stat:"",statLabel:"",note:"",source:"",link:"cost-benefit",linkLabel:"Test it in the workbench"},{id:"queues",label:"Queue times",icon:"timer",kicker:"Benefit 2",heading:"Reduced queue times",body:"More check-in points working in parallel means guests wait less.",bullets:["Needs: a quick, reliable flow — slow or failing kiosks create new queues.","Trade-off: a confusing kiosk moves the queue rather than removing it.","Metric to validate: median and 95th-percentile wait, before vs after."],stat:"",statLabel:"",note:"",source:"",link:null,linkLabel:""},{id:"peaks",label:"Peak absorption",icon:"users",kicker:"Benefit 3",heading:"Peak absorption — handling demand spikes",body:"Kiosks add capacity during arrival rushes without rostering extra staff for those hours.",bullets:["Needs: enough kiosks, with staff nearby to assist during the peak.","Trade-off: capacity sits idle off-peak, so size for real arrival patterns.","Metric to validate: peak-hour arrivals handled within your target wait."],stat:"",statLabel:"",note:"",source:"",link:null,linkLabel:""},{id:"upselling",label:"Upselling",icon:"trending",kicker:"Benefit 4",heading:"Potential for upselling",body:"A kiosk can present relevant, optional offers at a natural moment in the journey.",bullets:["Needs: offers guests value, optional and easy to dismiss.","Trade-off: pushy prompts frustrate guests and can drive them away.","Metric to validate: incremental contribution per kiosk check-in."],stat:"",statLabel:"",note:"",source:"",link:"guest-journey",linkLabel:"See the Deposit stage"}]}}]},{schemaVersion:1,id:"other-industries",eyebrow:"Chapter 1 · Understanding Kiosks",title:"Self-service kiosks in other industries",subtitle:"Open each card to see what changed — and what a hotel could borrow.",layout:"single",theme:"sage",sourceRefs:[{path:"docs/ground_truth.md",sectionId:"pdf-page-08-self-service-kiosks-in-other-industries-1",sectionHash:"74ba4a64ef4bd1190e78745ed0a1a15ce79f553e62f040ed408565409c0fdf29"}],notes:"",blocks:[{id:"industries",slot:"full",locked:!1,type:"explorer",props:{title:"Three industries, three results",dataLabel:"External examples from different industries — not predictions for a hotel. Figures are reproduced from the source deck and await independent verification.",variant:"cards",centerLabel:"",items:[{id:"mcdonalds",label:"McDonald's",icon:"food",kicker:"F&B",heading:"What could a hotel borrow?",body:"Offer relevant, optional add-ons.",bullets:["Suggest one or two relevant extras — breakfast, late checkout — at the right step.","Keep every offer optional and easy to skip."],stat:"20%",statLabel:"increase in average order size through upselling¹",note:"",source:"¹ Farrukh, Q. (2024, January 20). McDonald's self ordering kiosks: Benefits, use cases, and lessons for fast-food brands. Wavetec. https://www.wavetec.com/blog/mcdonalds-leveraging-self-service-technologies/",link:null,linkLabel:""},{id:"changi",label:"Changi Airport",icon:"plane",kicker:"Airports",heading:"What could a hotel borrow?",body:"Simplify the arrival process, with assistance provided.",bullets:["Move steps before arrival (pre-check-in).","Station staff to help rather than leaving guests alone with the machine."],stat:"50%",statLabel:"reduction in check-in duration²",note:"",source:"² Changi Airport Group. (2022). Passengers save time with more efficient processes at Changi. https://www.changiairport.com/en/corporate/our-media-hub/publications/changi-journeys/2022/passengers-save-time-with-more-efficient-processes-at-changi.html",link:null,linkLabel:""},{id:"uniqlo",label:"UNIQLO",icon:"tag",kicker:"Retail",heading:"What could a hotel borrow?",body:"Remove redundant inputs.",bullets:["Scan rather than type: passports, QR codes, saved profiles.","Ask only for what the hotel genuinely needs."],stat:"50%",statLabel:"reduction in waiting time through simpler operations³",note:"",source:"³ Fast Retailing. (2019). Annual report 2019, p. 14. https://www.fastretailing.com/eng/ir/library/pdf/ar2019_en.pdf",link:null,linkLabel:""}]}}]},{schemaVersion:1,id:"success-cases",eyebrow:"Chapter 1 · Real-world case studies",title:"What successful kiosk implementations did right",subtitle:"Two cases from hospitality and airports. Reveal the evidence, then follow the lesson.",layout:"single",theme:"sage",sourceRefs:[{path:"docs/ground_truth.md",sectionId:"pdf-page-09-successful-kiosk-implementation-case-studies-1",sectionHash:"94ed5488301c2766c8b9ca8e9c7f5b46704cd35ba5df09d191fa02e3c02b0468"}],notes:"",blocks:[{id:"successes",slot:"full",locked:!1,type:"explorer",props:{title:"Successful implementations",dataLabel:"Claims reproduced from the source deck. Methodology and publication context are still to be verified; “expected” is not the same as measured.",variant:"cards",centerLabel:"",items:[{id:"citizenm",label:"citizenM",icon:"hotel",kicker:"Hospitality",heading:"Reveal the evidence",body:"What it did right: identified its target consumers precisely.",bullets:["Staff assistance was provided for guests who needed it.","< 2 mins for check-in including payment","Lesson: know which guests suit self-service before you design for them."],stat:"90% independent check-ins",statLabel:"Guests are able to check in seamlessly by themselves",note:"",source:"Original citation: https://www.scribd.com/document/1074938127/Strategic-Case-Study-CitizenM-1",link:"chapter-2",linkLabel:"Apply it in Strategy"},{id:"maxworth",label:"Maxworth kiosks",icon:"plane",kicker:"Airports · India",heading:"Reveal the evidence",body:"What it did right: a multilingual touch interface supporting multiple airlines, for different passenger types.",bullets:["Integrated with departure controls, airport databases and real-time monitoring.","Secure data handling and failure alerts.","Manual counter dependency dropped to 40%.","Lesson: integration and monitoring matter as much as the screen."],stat:"75% faster",statLabel:"Flight check-ins fall from 6 minutes to 1.5 minutes",note:"",source:"Original citation: https://www.maxworthsystems.com/casestudy/self-check-in-koisk",link:"workstreams",linkLabel:"Apply it in Execution"}]}}]},{schemaVersion:1,id:"failure-cases",eyebrow:"Chapter 1 · Real-world case studies",title:"Why some kiosk implementations failed",subtitle:"Reveal each failure mode — and how a hotel can avoid it.",layout:"single",theme:"sage",sourceRefs:[{path:"docs/ground_truth.md",sectionId:"pdf-page-10-unsuccessful-implementation-case-studies-1",sectionHash:"4ab182c9bc9ad6552066773bc467ee053a89b832db758ee8294750ade1a47a34"}],notes:"",blocks:[{id:"failures",slot:"full",locked:!1,type:"explorer",props:{title:"Unsuccessful implementations",dataLabel:"Failure cases from the source deck. Attribution and survey details are flagged for verification.",variant:"cards",centerLabel:"",items:[{id:"target",label:"Self-check-out kiosks at Target",icon:"tag",kicker:"Retail",heading:"How can a hotel avoid this",body:"Poor execution — insufficient bagging space — operational bottlenecks.",bullets:["Provide enough bagging space for the largest likely guest loads.","Keep bags and belongings within easy reach without obstructing the kiosk flow.","Test peak-use scenarios so queues do not spill into guest circulation areas."],stat:"8% slower",statLabel:"Drastically slowed check-outs and long queues",note:"",source:"https://www.customerexperiencedive.com/news/targets-express-self-checkout-customer-satisfaction/717288/",link:"guest-journey",linkLabel:"See Arrival design"},{id:"qsr",label:"Quick-service restaurants",icon:"food",kicker:"F&B",heading:"How can a hotel avoid this",body:"Frequent glitches — incorrect items, order corrections, loyalty points not registering — went unresolved, so kiosks became unreliable.",bullets:["A separate finding: 29% changed ordering method or left because of tip prompts.","Log crashes and complaints, and fix recurring faults fast.","Keep a staffed fallback ready whenever a kiosk fails."],stat:"37% incomplete orders",statLabel:"Customers gave up after total functional failure of the kiosk",note:"Survey figures reproduced from the source; question wording and sample size are still to be verified.",source:"https://www.qsrweb.com/news/canopy-survey-finds-kiosk-reliability-remains-a-challenge-for-qsrs/",link:"improvement-loop",linkLabel:"See the improvement cycle"}]}}]},{schemaVersion:1,id:"chapter-2",eyebrow:"Chapter 2",title:"Strategy",subtitle:"",layout:"freeform",canvas:{aspectRatio:1.7777777777777777,referenceWidth:1280},heading:{frame:{x:44,y:22,width:50,height:34,rotation:0,zIndex:1},style:{fontSize:64,lineHeight:1.05},eyebrowFontSize:22,subtitleFontSize:22},theme:"ink",sourceRefs:[{path:"docs/ground_truth.md",sectionId:"pdf-page-11-chapter-2-divider-1",sectionHash:"151f123becfb70c346cd49e3f0921a99f94d81fac55b78e3db74d73dff1e4493"}],notes:"",blocks:[{id:"chapter-2-kiosk",slot:"full",locked:!1,frame:{x:7,y:12,width:30,height:78,rotation:0,zIndex:2},type:"image",props:{src:"chapter-kiosk-2.svg",alt:"Kiosk showing chapter 2",caption:""}},{id:"chapter-2-rule",slot:"full",locked:!1,frame:{x:44,y:57,width:22,height:2,rotation:0,zIndex:2},style:{background:"#B88A68",borderRadius:2},type:"shape",props:{kind:"rectangle",label:"Orange divider rule"}},{id:"chapter-2-subtitle",slot:"full",locked:!1,frame:{x:44,y:62,width:50,height:12,rotation:0,zIndex:2},style:{fontSize:26,color:"#FFFFFF",lineHeight:1.35},type:"text",content:{type:"doc",content:[{type:"paragraph",content:[{type:"text",text:"Identify our guests → Uncover their needs → Address those needs",marks:[{type:"italic"}]}]}]}}]},{schemaVersion:1,id:"who-are-our-guests",eyebrow:"Identify our guests → Uncover their needs → Address those needs",title:"Who are our guests?",subtitle:"",layout:"freeform",canvas:{aspectRatio:1.7777777777777777,referenceWidth:1280,chrome:{inset:6,top:3,bottom:3}},heading:{frame:{x:6,y:12,width:88,height:18,rotation:0,zIndex:1},style:{fontSize:44,lineHeight:1.1},eyebrowFontSize:14},theme:"sage",sourceRefs:[{path:"docs/ground_truth.md",sectionId:"pdf-page-12-who-are-our-guests-animated-reveal-plan-1",sectionHash:"77f3570e942292f0f12402d15c0f0ef407c7f2b5fc05e7fe81b95e9bcc94fbd2"},{path:"docs/ground_truth.md",sectionId:"pdf-page-13-diverse-guest-illustration-question-mark-1",sectionHash:"3fca533fdf3eafaee81c6e9f43df4b1a35ebe9e43b2d935162f30cc978ebc41a"}],notes:"",blocks:[{id:"crowd",slot:"full",locked:!1,frame:{x:6,y:30,width:55,height:58,rotation:0,zIndex:2},type:"image",props:{src:"guest-crowd.svg",alt:"Line drawing of varied travellers with luggage under a large orange question mark",caption:""}},{id:"crowd-copy",slot:"full",locked:!1,frame:{x:65,y:32,width:29,height:44,rotation:0,zIndex:2},style:{fontSize:22,lineHeight:1.45},type:"text",content:{type:"doc",content:[{type:"paragraph",content:[{type:"text",text:"One kiosk path rarely suits everyone."}]},{type:"paragraph",content:[{type:"text",text:"A solo backpacker, a tour group of twenty and a late-night business traveller arrive with different needs, devices, languages and time pressure."}]},{type:"paragraph",content:[{type:"text",text:"What makes these guests’ needs different?",marks:[{type:"bold"}]}]}]}},{id:"crowd-caution",slot:"full",locked:!1,frame:{x:65,y:78,width:29,height:10,rotation:0,zIndex:2},style:{fontSize:15,color:"#493A32",background:"#F1E9DF",borderRadius:10,padding:12},type:"text",content:{type:"doc",content:[{type:"paragraph",content:[{type:"text",text:"Look at what guests do and tell you — not at what they look like."}]}]}}]},{schemaVersion:1,id:"guest-attributes",eyebrow:"Chapter 2 · Identify our guests",title:"Five things to know about your guests",subtitle:"Reveal each attribute, then ask: which ones change what a guest needs at check-in?",layout:"single",theme:"sage",sourceRefs:[{path:"docs/ground_truth.md",sectionId:"pdf-page-14-attribute-reveal-bridge-source-intentionally-blank-1",sectionHash:"83c25c86c469b907c21307fa32104c387dc5e60ff638fd77a947e53e11f0058b"},{path:"docs/ground_truth.md",sectionId:"pdf-page-15-five-guest-segmentation-attributes-1",sectionHash:"f5823be76d5d7853384bf7fddf5690ce3a25b23da4aff6f28225e8d83c4f66dc"}],notes:"",blocks:[{id:"attributes",slot:"full",locked:!1,type:"explorer",props:{title:"Guest segmentation attributes",dataLabel:"Categories and values from the source. Labels are unvalidated generalisations; prefer guests’ actual preferences and abilities over demographic assumptions.",variant:"grid",centerLabel:"",items:[{id:"age",label:"Age of booker",icon:"user",kicker:"",heading:"Reveal",body:"",bullets:["18–27: digital natives","28–45: possible adopters","46–65: selective tech adopters","66+: traditional high-touch guests"],stat:"",statLabel:"",note:"Ask about preferences rather than assume them from age.",source:"",link:null,linkLabel:""},{id:"residence",label:"Country of residence",icon:"globe",kicker:"",heading:"Reveal",body:"",bullets:["APAC","EURO-West (Nordics and Western Europe)","EURO-East (Mediterranean & Eastern Europe)","North America","LATAM (Central & South America)","MEA (Middle East & Africa)"],stat:"",statLabel:"",note:"Residence is not nationality. Use it for practical needs such as language support.",source:"",link:null,linkLabel:""},{id:"purpose",label:"Purpose of travel",icon:"briefcase",kicker:"",heading:"Reveal",body:"",bullets:["Business","Education","Leisure","Cultural / religious"],stat:"",statLabel:"",note:"Purpose can shape arrival time, invoicing needs and relevant offers.",source:"",link:null,linkLabel:""},{id:"group",label:"Group size",icon:"users",kicker:"",heading:"Reveal",body:"",bullets:["Solo","Friends / Couples","Family",">20 large groups"],stat:"",statLabel:"",note:"A large group may need one batch check-in, not twenty separate ones.",source:"",link:null,linkLabel:""},{id:"stay",label:"Duration of stay",icon:"calendar",kicker:"",heading:"Reveal",body:"",bullets:["n days","n weeks","n months"],stat:"",statLabel:"",note:"Longer stays bring different needs, such as luggage and repeat visits.",source:"",link:null,linkLabel:""}]}}]},{"schemaVersion":1,"id":"guest-composition","eyebrow":"Chapter 2 · Identify our guests","title":"What is your guest mix?","subtitle":"Split your arriving guests between personas. Rename them, set each share, or add and remove personas — the next slide scores each one.","layout":"single","theme":"sage","sourceRefs":[{"path":"docs/ground_truth.md","sectionId":"pdf-page-16-persona-observation-22-year-old-japanese-solo-traveller-1","sectionHash":"3347ffef8773213b34e850f00121454b64b001b3ff4ba70a468868a7fcaede0f"},{"path":"docs/ground_truth.md","sectionId":"pdf-page-17-annotated-observation-solo-sam-1","sectionHash":"b2ced0b28e282145c61267185d8cdbcd28d5af791de9db6bfe4865c6b86bb8d4"},{"path":"docs/ground_truth.md","sectionId":"pdf-page-18-needs-potentials-solo-sam-1","sectionHash":"5edb52408a040c11ba6271b6dc43078d68c0510f25611458c943f0617e2c2cda"},{"path":"docs/ground_truth.md","sectionId":"pdf-page-19-persona-observation-george-the-guide-1","sectionHash":"4921a47403aa63f2cc75f98d0381ff7b8614a198db6f3535161a3d94b8833f36"},{"path":"docs/ground_truth.md","sectionId":"pdf-page-20-annotated-observation-george-the-guide-1","sectionHash":"76f5965f3832ff9b8463f6acaeb25ef1d3a8504e3a2b8ea52ab2e1334b0b5e3c"},{"path":"docs/ground_truth.md","sectionId":"pdf-page-21-needs-potentials-george-the-guide-1","sectionHash":"ef2c4ba6b31f0f92785214bcf6286805447accddb642545bc18d770918981736"},{"path":"docs/ground_truth.md","sectionId":"pdf-page-22-persona-observation-bob-business-1","sectionHash":"aed04db3e9057dbcfa09de00bdce12a666e5259b74aebebcee2d90c21dea1c38"},{"path":"docs/ground_truth.md","sectionId":"pdf-page-23-annotated-observation-bob-business-1","sectionHash":"3961518c3d581a40c691eb0aa39601b2cf2144512cedd4f67471eadfbe01a28f"},{"path":"docs/ground_truth.md","sectionId":"pdf-page-24-needs-potentials-bob-business-1","sectionHash":"42cdd3b10afe9770638ed32a14b78578d2e7a1f2b6bc0637cd50b254c808c714"}],"notes":"","blocks":[{"id":"composition","slot":"full","locked":false,"type":"guest-composition","props":{"title":"Guest composition","dataLabel":"Illustrative starting split of three fictional personas — replace it with your own booking or arrival data. Shares are a percentage of all arriving guests.","recordId":"guest-composition"}}]},{schemaVersion:1,id:"suitability-score",eyebrow:"Chapter 2 · Address those needs",title:"Kiosk suitability rating",subtitle:"Score each persona in your guest mix, then finish to see one recommended primary check-in for your whole guest population.",layout:"single",theme:"sage",sourceRefs:[{path:"docs/ground_truth.md",sectionId:"pdf-page-25-kiosk-suitability-score-0-100-1",sectionHash:"d6f72fb5bc0696ed3a236f308fda5243f0bfe2a3d073af5de0802612de332029"},{path:"docs/ground_truth.md",sectionId:"pdf-page-26-tech-use-score-t-cues-the-hotel-can-collect-1",sectionHash:"af1d8b8c0dcabb4f21a67074be1a8ee4980ae9526651a1c0dd17bdc8b24ae40e"}],notes:"",blocks:[{id:"suitability",slot:"full",locked:!1,type:"suitability-calculator",props:{title:"Score each persona",dataLabel:"Equal factor weights and purpose-of-travel multipliers are workshop assumptions — unvalidated. The overall recommendation weights each persona by its share of guests. Age and region are proxies that can be unfair: use this only as a workshop discussion tool, never to deny or steer a guest.",recordId:"suitability",weights:{T:.2,A:.2,G:.2,N:.2,B:.2},factors:{A:[{label:"18–27",value:1},{label:"28–45",value:.8},{label:"46–65",value:.5},{label:"66+",value:.2}],G:[{label:"Solo",value:1},{label:"2–4",value:.8},{label:"5–9",value:.5},{label:"10–19",value:.3},{label:"20+",value:.1}],N:[{label:"APAC",value:.8},{label:"EURO-West",value:.8},{label:"North America",value:.8},{label:"EURO-East",value:.6},{label:"LATAM",value:.6},{label:"MEA",value:.5}],B:[{label:"Business",value:.8},{label:"Leisure",value:.6},{label:"Education",value:1},{label:"Cultural",value:.4},{label:"Others",value:.6}]},cues:[{id:"precheckin",group:"Booking data (PMS, booking engine)",cue:"Completed online pre-check-in",points:1},{id:"wallet",group:"Booking data (PMS, booking engine)",cue:"Paid with Apple Pay, Google Pay or a saved card when booking",points:1},{id:"ride-hail",group:"Arrival (door or bell staff)",cue:"Arrived by ride-hail (Grab, Gojek, TADA)",points:1},{id:"wearables",group:"Arrival (door or bell staff)",cue:"Wearing earbuds or a smartwatch",points:1}],bands:[{min:70,label:"Kiosk-first"},{min:45,label:"Kiosk with staff nearby"},{min:0,label:"Counter"}]}}]},{schemaVersion:1,id:"chapter-3",eyebrow:"Chapter 3",title:"Design",subtitle:"",layout:"freeform",canvas:{aspectRatio:1.7777777777777777,referenceWidth:1280},heading:{frame:{x:44,y:22,width:50,height:34,rotation:0,zIndex:1},style:{fontSize:64,lineHeight:1.05},eyebrowFontSize:22,subtitleFontSize:22},theme:"ink",sourceRefs:[{path:"docs/ground_truth.md",sectionId:"pdf-page-27-chapter-3-divider-1",sectionHash:"777c6d640ac5e6d5ca8418f9070535af89d5901ecdbb5148dd72262d84599ad7"}],notes:"",blocks:[{id:"chapter-3-kiosk",slot:"full",locked:!1,frame:{x:7,y:12,width:30,height:78,rotation:0,zIndex:2},type:"image",props:{src:"chapter-kiosk-3.svg",alt:"Kiosk showing chapter 3",caption:""}},{id:"chapter-3-rule",slot:"full",locked:!1,frame:{x:44,y:57,width:22,height:2,rotation:0,zIndex:2},style:{background:"#B88A68",borderRadius:2},type:"shape",props:{kind:"rectangle",label:"Orange divider rule"}},{id:"chapter-3-subtitle",slot:"full",locked:!1,frame:{x:44,y:62,width:50,height:12,rotation:0,zIndex:2},style:{fontSize:26,color:"#FFFFFF",lineHeight:1.35},type:"text",content:{type:"doc",content:[{type:"paragraph",content:[{type:"text",text:"User Journey & Design Considerations",marks:[{type:"italic"}]}]}]}}]},{schemaVersion:1,id:"guest-journey",eyebrow:"Chapter 3 · Design",title:"User Journey & Design Considerations",subtitle:"Select a stage — or use ← → — to see what each touchpoint must get right.",layout:"single",theme:"sage",sourceRefs:[{path:"docs/ground_truth.md",sectionId:"shared-structure-for-pdf-pages-28-34-journey-explorer-1",sectionHash:"fcee50426efaa76a4249b594d82e4f3ce8040d2c1cf04156095c1ef26643bef9"},{path:"docs/ground_truth.md",sectionId:"pdf-page-28-journey-1-pre-check-in-1",sectionHash:"1180ffd8a33bdc20cb11454a7d9386515ef1e0543470104dd062d5f45e081f85"},{path:"docs/ground_truth.md",sectionId:"pdf-page-29-journey-2-arrival-1",sectionHash:"78c7fd426c63d54182c93ca231dc1cb42ddb9f9108af3dc3fd697ade17a8b5d3"},{path:"docs/ground_truth.md",sectionId:"pdf-page-30-journey-3-kiosk-1",sectionHash:"bb39810f8790babb75f84c66257ee80cb23f073eccb6a91b358fcdb93731a765"},{path:"docs/ground_truth.md",sectionId:"pdf-page-31-journey-4-passport-scanning-1",sectionHash:"445f6205aca1358bee614b6bc4dcec80368548b570cd1ab8211aba58b307b3e3"},{path:"docs/ground_truth.md",sectionId:"pdf-page-32-journey-5-facial-matching-1",sectionHash:"32b5192dbd99803f0a41be5ba5e296b954a5d6dc61fbe4c04968c004eab82ed5"},{path:"docs/ground_truth.md",sectionId:"pdf-page-33-journey-6-deposit-1",sectionHash:"e7d5106f776f0e45353dc19cd70ee03fb58ec4a308b6678794cc8756218cb3bd"},{path:"docs/ground_truth.md",sectionId:"pdf-page-34-journey-7-keycard-dispensing-1",sectionHash:"083ef4bc566a71cdb08b6dca4ce25f388dbb689df210adc583dd75290fb46aca"}],notes:"",blocks:[{id:"journey",slot:"full",locked:!1,type:"explorer",props:{title:"Seven stages of a kiosk check-in",dataLabel:"Stages and design considerations from the source (pages 28–34). Principle links are teaching aids.",variant:"journey",centerLabel:"",items:[{id:"precheck",label:"Pre-check-in",icon:"clipboard",kicker:"Focus",heading:"Push difficulty and prime guest to use the kiosk",body:"",bullets:["Tedious stuff done beforehand and at their comfort level.","Reassuring by showing progress and inspiring confidence in the system.","Understands the value and expectation of using the kiosk.","Personalised touchpoint.","Timely reminders.","Incentivised to use the kiosk."],stat:"",statLabel:"",note:"Principles: 1 Front-load the effort · 6 Personalization",source:"",link:null,linkLabel:""},{id:"arrival",label:"Arrival",icon:"footprints",kicker:"Focus",heading:"Ensure that user chooses to use the kiosk",body:"",bullets:["Well-planned placement provides a clear sightline so guests notice the kiosk.","Signage makes its usage and eligibility clear.","The kiosk should inspire confidence that it can achieve the goal of checking in.","Appear more attractive than the next best alternative.","Appear cohesive and part of the hotel check-in experience."],stat:"",statLabel:"",note:"Principles: 2 Easy to find, easy to choose · 5 Hospitality, not a transaction",source:"",link:"placement-tool",linkLabel:"Plan your lobby"},{id:"kiosk",label:"Kiosk",icon:"kiosk",kicker:"Focus",heading:"How to ensure the kiosk-usage experience is as pleasant as possible",body:"",bullets:["Physical considerations, e.g. where guests can place luggage or children.","User experience: big, bright screen; clear progress; minimal data entry (scan rather than type).","Simple interface.","Aesthetic and branding alignment provide a premium experience.","Adaptable flow: Express, Group/Assisted, Self-guided.","Accessibility for guests with disabilities, including height, reach and font size."],stat:"",statLabel:"",note:"Principles: 3 Clear indication and hand-holding · 5 Hospitality, not a transaction",source:"",link:null,linkLabel:""},{id:"passport",label:"Passport Scanning",icon:"passport",kicker:"Focus",heading:"Friction point — combine and use at the pre-check-in phase",body:"",bullets:["Clear, guided, animated placement.","Show progress across multiple guests.","Privacy screen; keep personal details off the display."],stat:"",statLabel:"",note:"Whether scanning can move to pre-check-in depends on local law, identity-verification rules and hotel systems. Principles: 1 · 3 · 4",source:"",link:null,linkLabel:""},{id:"face",label:"Facial Matching",icon:"face",kicker:"Focus",heading:"Higher friction touchpoint as guests may be uncomfortable",body:"",bullets:["Clear information about the image: its purpose, who can access it, and whether it is kept or destroyed.","Show a live preview.","Camera height and angle should suit different guests.","Alternatives for human verification provided."],stat:"",statLabel:"",note:"Facial matching is not universally required or lawful. Any real deployment needs legal and privacy review — and a staffed alternative. Principle 4 Trust through transparency",source:"",link:null,linkLabel:""},{id:"deposit",label:"Deposit",icon:"card",kicker:"Focus",heading:"Finances should feel transparent and fast",body:"",bullets:["Make upsells optional and dismissible.","Elevate the experience with rewards (e.g. free breakfast / tea-time set).","Make the next step something exciting to get this part over: “Show me my room!”"],stat:"",statLabel:"",note:"Principles: 4 Trust through transparency · 6 Personalization",source:"",link:null,linkLabel:""},{id:"keycard",label:"Keycard Dispensing",icon:"key",kicker:"Focus",heading:"Leave guests feeling the process was smooth and efficient — with a warm touch",body:"",bullets:["Sense of accomplishment, e.g. a simple animation showing the speed of the experience.","Personalisation: a welcome message in the guest’s language as a closing touchpoint.","Clear indication that the kiosk process is complete; show a welcome.","An intentional closing touchpoint: share FAQs such as Wi-Fi and breakfast hours, with an option to send the information to themselves."],stat:"",statLabel:"",note:"Principles: 5 Hospitality, not a transaction · 6 Personalization",source:"",link:null,linkLabel:""}]}}]},{schemaVersion:1,id:"design-principles",eyebrow:"Chapter 3 · Design",title:"Consolidated design principles",subtitle:"All six at a glance. Open a tile for the journey stages behind it and a quick check.",layout:"single",theme:"sage",sourceRefs:[{path:"docs/ground_truth.md",sectionId:"pdf-page-35-consolidated-design-principles-1",sectionHash:"6bb38c81d83a824ea2f71727b3d4a4f1badb3ccc014e751dc156e075b1a441f3"}],notes:"",blocks:[{id:"principles",slot:"full",locked:!1,type:"explorer",props:{title:"Six design principles",dataLabel:"Principle names and descriptions from the source; stage links and quick checks are teaching aids.",variant:"grid",centerLabel:"",items:[{id:"front-load",label:"1 · Front-load the effort",icon:"clipboard",kicker:"",heading:"Stages & quick check",body:"Tedious work done in guests’ own time and comfort.",bullets:["Stages: Pre-check-in, Passport Scanning","Check: what can a guest finish before arriving?"],stat:"",statLabel:"",note:"",source:"",link:null,linkLabel:""},{id:"find-choose",label:"2 · Easy to find, easy to choose",icon:"eye",kicker:"",heading:"Stages & quick check",body:"Be the more attractive option and inspire confidence.",bullets:["Stage: Arrival","Check: can a first-time guest see the kiosk — and what it’s for — from the door?"],stat:"",statLabel:"",note:"",source:"",link:null,linkLabel:""},{id:"hand-holding",label:"3 · Clear indication and hand-holding",icon:"hand",kicker:"",heading:"Stages & quick check",body:"Steps should be obvious; guests should not feel able to fail at it.",bullets:["Stages: Kiosk, Passport Scanning, Keycard Dispensing","Check: does every screen show progress and one clear next action?"],stat:"",statLabel:"",note:"",source:"",link:null,linkLabel:""},{id:"transparency",label:"4 · Trust through transparency",icon:"shield",kicker:"",heading:"Stages & quick check",body:"Explain what we are doing and why.",bullets:["Stages: Facial Matching, Deposit","Check: does the guest know why an image is taken, who sees it and whether it is kept?"],stat:"",statLabel:"",no .suit-overall{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:1.1em;min-width:0}
.suit-overall-title{margin:0;font-family:var(--font-display);font-size:1em;text-align:center;color:var(--brand-espresso)}
.suit-breakdown{display:flex;flex-direction:column;gap:.8em;min-width:0}
.suit-table{width:100%;border-collapse:collapse;font-size:.85em;background:#fff;border:2px solid var(--k-line)}
.suit-table caption{text-align:left;font-weight:700;font-size:.95em;padding-bottom:.35em;color:var(--brand-brown-text)}
.suit-table th,.suit-table td{padding:.4em .65em;border-bottom:1px solid #E8E5E0;text-align:right;font-variant-numeric:tabular-nums}
.suit-table th[scope=row],.suit-table thead th:first-child{text-align:left}
.suit-table th[scope=row]{font-weight:600}
.suit-table thead th{font-size:.8em;text-transform:uppercase;letter-spacing:.05em;color:var(--k-muted)}
.suit-table .mix-swatch{width:.85em;height:.85em;margin-right:.45em;vertical-align:-.08em}
.suit-table tfoot th,.suit-table tfoot td{font-weight:800;border-bottom:0;border-top:2px solid var(--k-line)}
.suit-table tr.is-muted{color:var(--k-muted)}
.suit-judgement{display:flex;flex-direction:column;gap:.6em}
.ix .suit-judgement>button{align-self:flex-start}
.suit-judgement-body{background:var(--k-yellow);border-left:2px solid var(--brand-brown);border-radius:3px;padding:.8em 1.1em;animation:ix-in .22s ease both}
.suit-judgement-body h4{margin:.3em 0;font-family:var(--font-display);font-size:1.1em;color:var(--brand-espresso)}
.suit-judgement-body p{margin:.3em 0;font-size:.9em}
.suit-judgement-body .ix-bullets{font-size:.88em}
@media (max-width:820px){.mix-layout,.suit-layout,.suit-layout.is-overall,.suit-overall{grid-template-columns:minmax(0,1fr)}.mix-pie{max-width:14em;margin:0 auto}}
.suit-outcome{gap:.45em}
.suit-outcome>.ix-kicker,.suit-outcome-for{text-align:center}
.suit-outcome-for{margin:-.2em 0 .2em;font-weight:700;color:var(--brand-espresso)}
.calc-band-label.suit-band{font-size:1.2em;padding:.45em 1.1em;border-radius:3px;text-align:center}
.suit-outcome-note{margin:.2em 0 0;font-size:.82em;color:var(--k-muted)}
.suit-pill{display:inline-block;font-size:.92em;font-weight:700;padding:.12em .55em;border-radius:2px;background:var(--k-yellow)}
.suit-pill.is-go{background:var(--good-tint);color:var(--good-strong)}
.suit-pill.is-caution{background:var(--warn-tint);color:#4A3A00}
.suit-pill.is-stop{background:var(--bad);color:#fff}
.suit-persona-status .suit-pill{font-size:1em}</style>
</head><body><div id="root"></div></body></html>
