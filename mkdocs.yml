site_name: Redesigning the Hotel Arrival Experience
site_description: CDE4301 IS-431 Interim Report · Stanford GEDI Programme AY2026/27
site_author: CDE4301 IS-431
use_directory_urls: false

theme:
  name: material
  custom_dir: overrides
  favicon: favicon.ico
  language: en
  font: false
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - toc.integrate
    - toc.follow
    - navigation.top

nav:
  - Home: index.md
  - About Us: about.md
  - Interim Report: report.md
  - Kiosk Implementation Playbook: playbook.md

# Chapters are included in report.md rather than published as separate pages.
exclude_docs: |
  /chapters/

plugins:
  - include-markdown

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
      toc_depth: 2

extra_css:
  - stylesheets/report.css

extra_javascript:
  - javascripts/report.js

extra:
  generator: false
